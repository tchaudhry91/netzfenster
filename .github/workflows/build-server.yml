# Builds the netzfenster Zig server for Linux targets.
#
# - Every push to main: runs tests, builds static binaries, uploads them as
#   workflow artifacts (downloadable from the run's page).
# - Tag pushes (v*): additionally creates a GitHub Release with the binaries.
#
# The aarch64-linux-musl binary is statically linked — drop it on a Raspberry
# Pi (64-bit OS) with no runtime dependencies.

name: build-server

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"
      - name: Run tests
        run: zig build test
        working-directory: server

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-musl, x86_64-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
        working-directory: server
      - name: Stage binary with target suffix
        run: cp zig-out/bin/server server-${{ matrix.target }}
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: server/server-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List staged binaries
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/server-*